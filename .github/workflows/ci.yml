name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run lint
      - run: npm test
      - run: npm run version:suggest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    # Build only — do not publish here. Immutable GitHub releases cannot be
    # amended by later matrix jobs, so assets are uploaded once in publish-release.
    env:
      EB_PUBLISH: never
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Set SOURCE_DATE_EPOCH from tag commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.dist }}
      - name: Collect installers and update metadata
        shell: bash
        run: |
          mkdir -p dist-out
          find release -maxdepth 1 -type f \( \
            -name '*.exe' -o \
            -name '*.blockmap' -o \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.yml' \
          \) ! -name 'builder-debug.yml' -exec cp -v {} dist-out/ \;
          ls -la dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: bingo-${{ matrix.os }}
          path: dist-out/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bingo-*
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
