name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run lint
      - run: npm test
      - run: npm run version:suggest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-24.04
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    # Build only — do not publish here. Immutable GitHub releases cannot be
    # amended by later matrix jobs, so assets are uploaded once in publish-release.
    env:
      EB_PUBLISH: never
      # Ad-hoc mac signing (identity "-"); do not auto-pick a keychain identity.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Set SOURCE_DATE_EPOCH from tag commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: npm run ${{ matrix.dist }}
      - name: Verify macOS ad-hoc code signature
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          APP=$(find release -name 'Bingo.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Bingo.app not found under release/"
            find release -maxdepth 3 -type d
            exit 1
          fi
          echo "Verifying $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/codesign-info.txt
          if ! grep -q 'Signature=adhoc' /tmp/codesign-info.txt; then
            echo "Expected Signature=adhoc on Bingo.app"
            cat /tmp/codesign-info.txt
            exit 1
          fi
      - name: Collect installers and update metadata
        shell: bash
        run: |
          mkdir -p dist-out
          find release -maxdepth 1 -type f \( \
            -name '*.exe' -o \
            -name '*.blockmap' -o \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.yml' \
          \) ! -name 'builder-debug.yml' -exec cp -v {} dist-out/ \;
          ls -la dist-out
      - uses: actions/upload-artifact@v6
        with:
          name: bingo-${{ matrix.os }}
          path: dist-out/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: bingo-*
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: find artifacts -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
