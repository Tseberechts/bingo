<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; script-src 'self'">
  <title>Bingo — Publiek</title>
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="../game/styles.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-dark-bg min-h-screen font-sans text-white p-3 sm:p-4 lg:p-6 flex flex-col audience-view">

<header class="text-center mb-4">
  <h1 id="gameTitleHeader" class="text-4xl sm:text-5xl font-extrabold tracking-tight text-bingo-yellow"></h1>
</header>

<main class="flex-grow flex flex-col lg:flex-row gap-4 lg:gap-6 min-h-0">
  <div class="lg:w-2/3 bg-gray-800 p-4 rounded-2xl shadow-2xl flex flex-col min-h-0">
    <div id="historyPanel" class="history-panel">
      <div id="historyGrid" class="history-grid"></div>
    </div>
  </div>

  <div class="lg:w-1/3 flex flex-col gap-4 lg:gap-6 min-h-0">
    <div id="currentNumberDisplay" class="relative bg-main-bg-active p-4 sm:p-6 rounded-2xl shadow-2xl flex flex-col items-center justify-center min-h-0 flex-1 border-4 border-bingo-orange">
      <span id="currentNumber" class="text-[10rem] sm:text-[14rem] lg:text-[15rem] font-black leading-none text-bingo-yellow drop-shadow-lg font-mono">--</span>
    </div>
    <div id="roundCounter" class="text-center text-xl font-bold">Ronde: 1</div>
    <div id="inGameDisplay" class="flex-grow flex-col justify-center items-center min-h-0 hidden">
      <h2 id="inGameDisplayTitle" class="text-2xl font-bold text-bingo-yellow mb-4"></h2>
      <div id="inGameDisplayContent" class="relative w-full h-full"></div>
    </div>
  </div>
</main>

<script src="../shared/apply-brand-colors.js"></script>
<script src="index.js"></script>
</body>
</html>
